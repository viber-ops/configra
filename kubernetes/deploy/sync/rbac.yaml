apiVersion: v1
kind: ServiceAccount
metadata:
  name: configra-sync
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: configra-sync
rules:
  - apiGroups: [configra.viber-ops.github.io]
    resources: [configrabindings]
    verbs: [get, list, watch]
  - apiGroups: [configra.viber-ops.github.io]
    resources: [configrabindings/status]
    verbs: [get, update, patch]
  - apiGroups: ['']
    resources: [secrets, configmaps]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: ['']
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: configra-sync
subjects:
  - kind: ServiceAccount
    name: configra-sync
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: configra-sync
