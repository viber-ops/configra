apiVersion: v1
kind: Namespace
metadata:
  name: configra-provider
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: configra-provider
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: configra-provider
  template:
    metadata:
      labels:
        app.kubernetes.io/name: configra-provider
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/os: linux
      tolerations:
        - operator: Exists
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: provider
          image: configra-kubernetes
          args:
            - provider
            - --socket=/provider/configra.sock
            - --configra-url=https://configra-api.configra.svc
            - --server-ca-file=/run/configra-trust/ca.crt
          env:
            - name: GOMEMLIMIT
              value: 192MiB
          ports:
            - name: probes
              containerPort: 8081
          readinessProbe:
            httpGet: {path: /readyz, port: probes}
          livenessProbe:
            httpGet: {path: /healthz, port: probes}
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {memory: 256Mi}
          volumeMounts:
            - name: provider-sockets
              mountPath: /provider
            - name: server-trust
              mountPath: /run/configra-trust
              readOnly: true
      volumes:
        - name: provider-sockets
          hostPath:
            path: /var/run/secrets-store-csi-providers
            type: DirectoryOrCreate
        - name: server-trust
          secret:
            secretName: configra-server-trust
