apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: configra-private-listeners
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: configra
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
      ports:
        - {protocol: TCP, port: 8443}
        - {protocol: TCP, port: 9443}
    - from:
        - namespaceSelector:
            matchLabels:
              configra-client: "true"
      ports:
        - {protocol: TCP, port: 9443}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - {protocol: TCP, port: 9090}
