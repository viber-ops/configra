    mysql:
      dsn_env: CONFIGRA_MYSQL_DSN
    key_provider:
      master_key_file: /run/configra/master-key/master-key
    nats:
      urls: [tls://nats.example.internal:4222]
      credentials_file: /run/configra/nats/nats.creds
      root_ca_file: /run/configra/nats/ca.pem
    logging:
      level: info
