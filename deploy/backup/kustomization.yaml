apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: configra
resources: [mysql-cronjob.yaml]
configMapGenerator:
  - name: configra-backup-scripts
    files: [mysql-backup.sh, ship-s3.sh]
  - name: configra-backup-settings
    literals:
      - database=configra
      - s3-prefix=s3://REPLACE-private-backup-bucket/configra/mysql
      - pushgateway-url=http://pushgateway.monitoring.svc:9091
      - key-reference=REPLACE-escrow-reference-not-the-key
      - image-reference=REPLACE-actual-configra-image-digest
