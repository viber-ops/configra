name: Build release bundles

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.7'
          cache-dependency-path: |
            go.sum
            kubernetes/go.sum
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Test core and Kubernetes modules
        env:
          GOWORK: 'off'
          GOFLAGS: '-mod=readonly'
        run: |
          go test -race ./...
          go vet ./...
          go -C kubernetes test -race ./...
          go -C kubernetes vet ./...
      - name: Build four-platform bundles
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/build-release.mjs "$RELEASE_TAG"
      - name: Verify Linux binaries and checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd "dist/$RELEASE_TAG"
          sha256sum -c SHA256SUMS
          "configra_${RELEASE_TAG#v}_linux_amd64/configra" --version
          "configra_${RELEASE_TAG#v}_linux_amd64/configra-kubernetes" --version
      - name: Create reviewable draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --draft \
            --title "Configra $RELEASE_TAG" --generate-notes \
            "dist/$RELEASE_TAG/"*.tar.gz "dist/$RELEASE_TAG/SHA256SUMS"
