name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
    inputs:
      acceptance:
        description: 'Additional acceptance checks (a release needs both capacity and Kubernetes evidence)'
        type: choice
        default: all
        options: [all, capacity, kubernetes]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOWORK: 'off'
  GOFLAGS: '-mod=readonly'

jobs:
  go:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        module: ['.', kubernetes]
        go: ['1.25.13', '1.26.7']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: |
            go.sum
            kubernetes/go.sum
      - name: Test, vet and verify modules
        working-directory: ${{ matrix.module }}
        run: |
          go test -race -count=1 ./...
          go vet ./...
          go mod verify
      - name: Check reachable vulnerabilities
        if: matrix.go == '1.26.7'
        working-directory: ${{ matrix.module }}
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    defaults:
      run:
        working-directory: configra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: configra
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: viber-ops/configra-go
          ref: d092602d8c7b907c4b4f331d6869b447fcc5a4bc # v1.0.0
          path: configra-go
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.7'
          cache-dependency-path: |
            configra/go.sum
            configra/e2e/go.sum
            configra-go/go.sum
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: MySQL 8.0.22, NATS, ClickHouse and SDK integration
        run: make test-integration
      - name: Load harness sampling and leak-detector regressions (not the capacity gate)
        env:
          CONFIGRA_TEST_NATS_URL: nats://127.0.0.1:42229
        run: go -C e2e test -tags='integration load' -race -count=1 -run '^Test(SampleLoad|LoadLeak|LoadEvidence)'
      - name: Ten-minute production-image capacity and leakage gate
        if: github.event_name == 'workflow_dispatch' && inputs.acceptance != 'kubernetes'
        run: make load-test
      - name: Report bounded capacity metadata, including failed warmup
        if: always() && github.event_name == 'workflow_dispatch' && inputs.acceptance != 'kubernetes'
        run: |
          node --input-type=module <<'JS'
          import { existsSync, readFileSync } from 'node:fs';
          if (!existsSync('.cache/load/latest.json')) { console.log('No capacity report was produced.'); process.exit(0); }
          const report = JSON.parse(readFileSync('.cache/load/latest.json', 'utf8'));
          const { started_at, passed, stage, duration, requested_qps, host_os, host_arch, host_cpus, image,
            container_cpus, container_memory_bytes, mysql_version, mysql_interpolate_params,
            resources, expected_access_events, persisted_access_events, captured_access_events,
            nats_leak_scan_passed, leak_scan_passed } = report;
          const metrics = ({ latencies, requests, throughput, success, status_codes } = {}) => ({ latencies, requests, throughput, success, status_codes });
          console.log(JSON.stringify({ started_at, passed, stage, duration, requested_qps, host_os, host_arch, host_cpus, image,
            container_cpus, container_memory_bytes, mysql_version, mysql_interpolate_params,
            resources, expected_access_events, persisted_access_events, captured_access_events,
            nats_leak_scan_passed, leak_scan_passed, warmup: metrics(report.warmup), measured: metrics(report.vegeta) }, null, 2));
          JS
      - name: Remove disposable dependencies
        if: always()
        run: docker compose -f deploy/compose.test.yaml down
      - name: Actual service images, OIDC, dependency faults and encrypted recovery
        if: github.event_name != 'workflow_dispatch'
        run: make service-test
      - name: Install the Kubernetes acceptance tool
        if: '!cancelled() && github.event_name == ''workflow_dispatch'' && inputs.acceptance != ''capacity'''
        run: |
          go install sigs.k8s.io/kind@v0.33.0
          mkdir -p "$RUNNER_TEMP/configra-kubernetes-tools"
          curl --fail --silent --show-error --location --retry 3 https://dl.k8s.io/release/v1.35.0/bin/linux/amd64/kubectl -o "$RUNNER_TEMP/configra-kubernetes-tools/kubectl"
          printf '%s  %s\n' "$(curl --fail --silent --show-error --location --retry 3 https://dl.k8s.io/release/v1.35.0/bin/linux/amd64/kubectl.sha256)" "$RUNNER_TEMP/configra-kubernetes-tools/kubectl" | sha256sum --check
          chmod 755 "$RUNNER_TEMP/configra-kubernetes-tools/kubectl"
          printf '%s\n' "$RUNNER_TEMP/configra-kubernetes-tools" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/configra-kubernetes-tools/kubectl" version --client
          docker version
          docker pull busybox:1.37.0
      - name: Three-node Kubernetes services, providers, failure recovery and offline key rotation
        if: '!cancelled() && github.event_name == ''workflow_dispatch'' && inputs.acceptance != ''capacity'''
        run: make kubernetes-service-test
      - name: Report service check status and source locations without private error values
        if: always()
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { existsSync, readdirSync, readFileSync } from 'node:fs';
          const locations = (value) => [...new Set(value.match(/scripts\/(?:service-smoke|kubernetes-smoke|docs-smoke)\.mjs:\d+:\d+/g) ?? [])];
          assert.deepEqual(locations('private-value\n at /work/scripts/docs-smoke.mjs:12:3\n at /work/scripts/docs-smoke.mjs:12:3'), ['scripts/docs-smoke.mjs:12:3']);
          if (!existsSync('.cache')) process.exit(0);
          for (const directory of readdirSync('.cache').filter((name) => /^service-smoke-[A-Za-z0-9]+$/.test(name))) {
            const base = `.cache/${directory}`;
            if (existsSync(`${base}/result.json`)) {
              const { passed, failed_stage, checks } = JSON.parse(readFileSync(`${base}/result.json`, 'utf8'));
              console.log(JSON.stringify({ passed, failed_stage, checks }));
            }
            for (const file of readdirSync(base).filter((name) => /failure\.txt$/.test(name))) {
              console.log(JSON.stringify({ diagnostic: file, locations: locations(readFileSync(`${base}/${file}`, 'utf8')) }));
            }
          }
          JS

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci --ignore-scripts
      - run: npx --prefix web playwright install --with-deps chromium
      - run: npm --prefix web run test:licenses
      - run: npm --prefix web test
      - run: node --test scripts/*.test.mjs scripts/go-notices/*.test.mjs
